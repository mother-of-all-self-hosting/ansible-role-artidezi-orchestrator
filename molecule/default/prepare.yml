---
- name: Prepare ArtiDezi orchestrator Molecule tests
  # The other inventory host is the same machine.
  hosts: all:!second-instance
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for ArtiDezi orchestrator Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for ArtiDezi orchestrator Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for ArtiDezi orchestrator Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker

    - name: Ensure the network standing in for the reverse proxy's exists
      ansible.builtin.command:
        cmd: docker network create {{ artidezi_orchestrator_molecule_proxy_network }}
      register: artidezi_orchestrator_molecule_proxy_network_result
      changed_when: artidezi_orchestrator_molecule_proxy_network_result.rc == 0
      failed_when: artidezi_orchestrator_molecule_proxy_network_result.rc != 0 and 'already exists' not in artidezi_orchestrator_molecule_proxy_network_result.stderr
