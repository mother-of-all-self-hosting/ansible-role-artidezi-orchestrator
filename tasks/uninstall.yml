---

- name: Check existence of the ArtiDezi orchestrator systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ artidezi_orchestrator_identifier }}.service"
  register: artidezi_orchestrator_service_stat

- name: Uninstall the ArtiDezi orchestrator systemd service
  when: artidezi_orchestrator_service_stat.stat.exists | bool
  block:
    - name: Ensure the ArtiDezi orchestrator systemd service is stopped and disabled
      ansible.builtin.systemd_service:
        name: "{{ artidezi_orchestrator_identifier }}.service"
        state: stopped
        enabled: false

    - name: Ensure the ArtiDezi orchestrator systemd service doesn't exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ artidezi_orchestrator_identifier }}.service"
        state: absent

    - name: Ensure systemd is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Ensure the ArtiDezi orchestrator container network doesn't exist
  when: artidezi_orchestrator_container_network_deletion_enabled | bool
  block:
    - name: Ensure the ArtiDezi orchestrator container network doesn't exist via community.docker.docker_network
      when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ artidezi_orchestrator_container_network }}"
        state: absent

    - name: Ensure the ArtiDezi orchestrator container network doesn't exist via ansible.builtin.command
      when: devture_systemd_docker_base_container_network_creation_method == 'command'
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} network rm {{ artidezi_orchestrator_container_network }}"
      register: artidezi_orchestrator_network_deletion_result
      changed_when: artidezi_orchestrator_network_deletion_result.rc == 0
      failed_when: artidezi_orchestrator_network_deletion_result.rc != 0 and 'not found' not in artidezi_orchestrator_network_deletion_result.stderr

- name: Ensure ArtiDezi orchestrator files don't exist
  ansible.builtin.file:
    path: "{{ artidezi_orchestrator_base_path }}"
    state: absent
