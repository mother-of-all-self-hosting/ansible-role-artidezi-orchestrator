---

- name: Perform ArtiDezi orchestrator installation tasks
  when: artidezi_orchestrator_enabled | bool
  tags:
    - setup-all
    - setup-artidezi-orchestrator
    - install-all
    - install-artidezi-orchestrator
  block:
    - name: Validate ArtiDezi orchestrator configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install ArtiDezi orchestrator
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform ArtiDezi orchestrator uninstallation tasks
  when: not artidezi_orchestrator_enabled | bool
  tags:
    - setup-all
    - setup-artidezi-orchestrator
  block:
    - name: Uninstall ArtiDezi orchestrator
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
